# 校园 RAG 系统 — 应用配置
# 依据：docs/校园RAG系统重构方案.md（v1.3）
#
# ⚠️ 密钥一律走环境变量，本文件只存「环境变量名」不存值（§3.2.1）。
# ⚠️ 规则词表必须配置化，不写死在代码里（§3.5.3 节点 2）。

app:
  name: "校园 RAG 检索问答系统"
  # 全站分页上限统一取 100，不在各处分别声明（§3.7.2）
  page_size_default: 20
  page_size_max: 100

llm:
  provider: deepseek
  base_url_env: DEEPSEEK_BASE_URL        # 官方 https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  # 官方 id，不是已退役的 deepseek-chat 别名，也不加 v4（见施工计划 §1.0）
  model: deepseek-flash
  # ★ 非思考模式：实测 ptok 36→10、reasoning_content 归零
  #   备用写法 thinking: {type: disabled} 同样实测生效（见施工计划 §1.0）
  reasoning_effort: "none"
  # 官方 /models 自报值
  context_window: 1048576
  max_output_tokens: 393216
  # 运行时保守值（远低于上限）；M5 按实际需要调
  max_output_tokens_runtime: 8192
  temperature: 0.3
  # 摘要用同一模型（用户口径：chat 模型都用 deepseek-flash 非思考模式）
  summary_model: deepseek-flash
  # token 计数用 dashscope 自带分词器（离线可用、零新增依赖）
  # ⚠️ 定位是「近似」：DeepSeek 分词器不可离线获取（施工计划 D-3）
  tokenizer_model: qwen3-max

embedding:
  provider: aliyun                        # ALIYUN / OLLAMA（可切换，§C.2.1）
  api_key_env: ALIYUN_ACCESS_KEY
  base_url_env: ALIYUN_BASE_URL
  model: qwen3.7-text-embedding
  # 实测确认（2026-10-05）：1024 维，与 Chroma collection 一致
  dimension: 1024
  # 批量向量化：20 chunk / 18000 字一批，指数退避重试（§3.4.1）
  batch_max_count: 20
  batch_max_chars: 18000
  max_retries: 3

chunking:
  chunk_size: 500
  chunk_overlap: 50
  chunk_min_size: 5                       # 最小字符数，过滤噪声片段

retrieval:
  # K = 每路召回数（单个「查询 × 检索器」组合取多少条）
  k: 10
  # 固定过采样 + 一次重试（§3.3.4）—— 仅对向量路适用
  oversample_first: 3                     # 首轮 n_results = 3 × K
  oversample_retry: 6                     # 重试 n_results = 6 × K
  # rrf融合后进入 rerank 的截断条数
  fusion_limit: 15
  # 最终进入 build_context 的条数
  top_k: 5
  rrf_k: 60                               # RRF 的 k —— 消融实验的调参对象
  # 权重一律 1.0：若各类权重不等，消融表里三行查询的增益会混入权重差异（§3.5.3 节点 6）
  rrf_weight: 1.0

reranker:
  # 精排后端。切换模型**只改这一行**，其余全部在下面的 profile 里。
  #   cross_encoder : BAAI bge-reranker-v2-m3（pointwise，sentence-transformers）
  #   jina_listwise : Jina Reranker v3.5（listwise，transformers + trust_remote_code）
  backend: jina_listwise

  # ============================================================
  # 后端 A：BAAI bge-reranker-v2-m3 —— pointwise 交叉编码器
  # ============================================================
  cross_encoder:
    model_path: models/BAAI/bge-reranker-v2-m3
    device: cuda
    batch_size: 10
    max_length: 512
    # 分数阈值：低于该分的 chunk 直接丢弃（全滤掉 → 零成本拒答）。
    # 0.3 的来历：2026-10-14 用 eval_min20 夹具 294 个候选全量打分实测 ——
    # 噪声 chunk 下四分位 0.101、中位数 0.476，期望命中 chunk 中位数 0.885，
    # 0.2–0.6 扫描 Recall@5 零损失。0.3 恰好裁在噪声分布的下 1/4 尾上。设 0 关闭。
    min_score: 0.3

  # ============================================================
  # 后端 B：Jina Reranker v3.5 —— listwise（整批一次前向、文档间互相注意）
  # ============================================================
  jina_listwise:
    model_path: models/jinaai/jina-reranker-v3.5
    device: cuda
    # listwise 不用 batch_size（整批一起算），保留该键只为两层配置同构
    batch_size: 10
    # 分批精排：每批最多多少个候选。listwise 的 token 数随候选数线性增长，
    # 24 个候选可达 2.4 万 token，6GB 显卡会颠簸到几十秒。10 个一批把峰值
    # 显存压回安全区；0 表示不分批（仅用于评测对照）。
    batch_candidates: 10
    # 模型支持 131K，但语料里的 chunk 都很短；2048 够用且省显存
    max_length: 2048
    # ⚠️ **刻度与 bge 完全不同，不能沿用 0.3**：
    #    2026-10-17 实测 6 条表格题 —— 阈值 0.1 → 目标块 5/6 通过、无关块 0 误放；
    #    沿用 0.3 → 0/6（全砍）；0.0 → 5/6 但会放进一条无关块（0.047）。
    #    Jina 对相关块给 0.28–0.50、对无关块给 −0.09–0.05。
    min_score: 0.1

  # ============================================================
  # 与模型无关的共用项
  # ============================================================
  # GPU 信号量：同时处理几个请求（显存不足会直接 OOM，必须有）
  max_concurrency: 2

# 各节点超时（秒）—— 初始值，M5 用真实流量校准（§3.5.3 节点 6）
timeouts:
  resolve: 5
  route: 5
  rewrite: 15
  retrieve: 10
  rerank: 30
  # 首字超时（TTFT）：覆盖消解→路由→检索→重排→生成首字
  generate_ttft: 60
  # 首字到达后，整条流另设上限 —— 与 TTFT 分别设置，否则长答案会被误杀
  generate_total: 180
  # 上传进度流等分钟级长连接的空闲超时
  sse_stream_timeout: 600
  # 滚动压缩：压缩在**请求路径内同步执行**，所以超时必须短于用户耐心 ——
  # 宁可这一轮不压缩（退回未压缩历史作答），也不能让用户干等
  compaction: 20

# 上下文预算（§3.8.2 / §3.8.3）
# ⚠️ 这组数按「成本与延迟」定的显式目标值，不从窗口派生
context:
  history_token_budget: 16000
  high_water_ratio: 0.8                   # H = 12800，触发线
  low_water_ratio: 0.5                    # L = 8000，压到这里停
  recent_messages_limit: 10               # 保留区大小，原文永不动
  compression_min_messages: 6             # 单次至少压缩条数
  summary_max_tokens: 800                 # 摘要产物自身上限（防无界膨胀）
  retrieval_context_budget: 8000          # 检索上下文预算，优先级最高
  # 整个 prompt 的硬上限用的安全余量（§3.8.2）：窗口 − 最大输出 − 本值
  safety_margin: 500

session:
  # 长锁 TTL 与心跳（§3.2.4）
  lock_ttl_seconds: 120
  lock_heartbeat_seconds: 30
  # request_id 幂等去重（不做持久化）
  dedup_ttl_seconds: 600

auth:
  jwt_secret_env: JWT_SECRET
  jwt_algorithm: HS256
  access_token_minutes: 15
  refresh_token_days: 7

# ============================================================
# 规则词表（§3.5.3 节点 2）—— resolve 前置闸门与 route 规则层共用同一份
# ⚠️ 两处必须用同一判据：判据是「整条消息没有实际诉求」，
#    不是「包含一个无信息量词」。拿不准时不跳过（knowledge > chat）。
# ============================================================
rules:
  # 无信息量词表 = 问候词 + 语气/确认词
  # ⚠️ 「继续」刻意不入表：它在多轮里是有效诉求（"接着说下去"）
  gate_words:
    - 你好
    - 您好
    - 在吗
    - 在不在
    - 谢谢
    - 多谢
    - 感谢
    - 再见
    - 拜拜
    - 嗨
    - 哈喽
    - hi
    - hello
    - 嗯
    - 哦
    - 好的
    - 收到
    - ok
    - OK

  # 制度名词：命中即倾向 knowledge（与疑问词组合），也是 clarify 的「能定位主题」判据
  # 与节点 2 规则层共用同一份，不另建（§3.5.3 节点 2）
  policy_nouns:
    - 缓考
    - 补考
    - 重修
    - 挂科
    - 学籍
    - 转专业
    - 专业分流
    - 学位
    - 毕业
    - 选课
    - 成绩
    - 学分
    - 奖学金
    - 处分
    - 申诉
    - 退学
    - 休学
    - 复学
    - 学业预警
    - 考试
    - 实习
    - 参军
    - 入伍
    - 退役
    - 保研
    - 推免
    - 教融合
    - 管理规定

  # 系统元问题词：用户问的是**系统自身**（你能做什么 / 有哪些功能 / 怎么用）。
  # 用途**只有一个**：算「能定位主题」，从而不触发澄清（与 policy_nouns 同类）。
  # ⚠️ 它**不是路由规则** —— 命中不直接判 chat。理由见 route.py 里 `_should_clarify`
  #    的说明：chat 分支不检索不引用，规则层直接判错就是答非所问，且没有 LLM 复核。
  # ⚠️ 澄清判据只在**短于 8 字**时才走到这里，所以这里只收「短问法」；
  #    够长的能力问询（「如何向你提问才能得到有效回答」）本来就会交给 LLM 判。
  #
  # ⚠️ 这里只收**固定问法**（问系统是谁 / 能干什么）。
  #    「怎么用」这类**用法问法**不在这里 —— 它们走下面的
  #    `usage_question_pattern`（模式），主语型的走 `system_self_words`。
  #    三者的分工是踩了两次坑才定下来的，别再合并回去：
  #      · 只枚举整句 → 漏「你怎么使用」（中间隔着「使」）
  #      · 再加主语判据 → 仍然漏「怎么操作」（没有主语）
  system_meta_words:
    - 你能做什么
    - 你能干什么
    - 你可以干什么
    - 你会什么
    - 你是谁
    - 你是干什么的

  # 系统自身指代词：消息的**主语是系统**（你 / 您 / 系统 / 助手 / 平台）。
  #
  # ⚠️ 为什么要按**主语**判、而不是把说法都枚举进 system_meta_words：
  #    2026-10-12 实测漏过一次 —— 「你怎么使用」里「怎么」和「使用」中间隔着
  #    一个「使」，既不含「怎么用」也不含「如何使用」，枚举出来的词表直接漏掉，
  #    用户换一种说法就被反问「你想问的是哪一项？」。
  #    **说法千变万化（你咋用 / 这个系统怎么用 / 您怎么操作），主语不变。**
  #
  # ⚠️ 放宽的代价很小：命中只意味着「不反问、交给 LLM 判」，而 LLM 的候选里
  #    本来就有 clarify —— 真模糊的问题它照样会反问你，只是多花一次调用。
  #    这与 `_should_clarify` 的口径一致：**误报（该答时反问）比漏报更糟**。
  system_self_words:
    - 你
    - 您
    - 系统
    - 助手
    - 平台

  # 用法问法的**模式**：疑问词 + 用法动词（怎么用 / 如何使用 / 怎么操作 / 咋用）。
  #
  # ⚠️ 为什么是模式而不是把整句说法枚举进上面的词表 —— 实测漏过两次：
  #    先漏「你怎么使用」（「怎么」与「使用」中间隔着一个「使」，两条短语都没匹配上），
  #    补了主语判据之后又漏「怎么操作」「咋用」（它们**没有主语**，主语判据管不着）。
  #    整句说法的组合是**开集**，而动词是**封闭的一小撮** —— 所以按动词收。
  #    「使」已覆盖「使用」；`\s*` 容许「怎么 用」这种中间带空格的写法。
  #
  # ⚠️ 动词表**不收**「办 / 弄 / 搞」：那几个正是真·模糊的代表，该澄清而不是放行
  #    （「怎么办」要反问，「怎么用」要引导，两者不能混）。
  usage_question_pattern: "(怎么|如何|咋)\\s*(用|使|操作|玩|问|提问|上手|开始)"

  # 疑问词
  # ⚠️ M2 首跑实测校准（2026-10-05）：原表漏了「几天」「多长时间」，
  #    导致「那要提前几天申请？」「那要在多长时间内提出？」这类追问
  #    省解特征三条全判不出来 → `no_feature` 静默跳过消解，原句直送检索。
  #    两轮当时「恰好」检索命中，但那是运气，没有任何机制保障。
  question_words:
    - 怎么
    - 怎样
    - 如何
    - 什么
    - 哪些
    - 哪里
    - 多久
    - 多少
    - 几天
    - 多长时间
    - 什么时候
    - 是否
    - 能不能
    - 可不可以
    - 需要
    - 条件

  # 代词（指代消解的触发依据）
  # ⚠️ 必须 jieba 分词后按词匹配，不能子串匹配 —— 否则「其他」会误命中「他」
  pronoun_words:
    - 他
    - 她
    - 它
    - 他们
    - 她们
    - 它们
    - 这个
    - 那个
    - 这些
    - 那些
    - 此
    - 该
    - 其
    - 上述
    - 上面
    - 前者
    - 后者

  # 文号正则：如 桂电教〔2025〕28号
  doc_number_pattern: "[〔\\[]\\d{4}[〕\\]]\\s*\\d+\\s*号"

clarify:
  # 问题过短且无法定位主题 → 触发澄清（两个条件同时满足）
  # 阈值 8 字是初始值，M2 用真实语料校准（§3.5.3 节点 2）
  min_length: 8
  # 澄清轮次上限（负责人 2026-10-06 定）：连续反问是体验最差的失败模式之一 ——
  # 实测用户点一下 facet 又被问一次。到顶改为「按最可能的理解作答 + 说明 + 引导」。
  max_chain_rounds: 2      # 同一条追问链最多反问 2 次（第 3 次被拦下）
  max_session_rounds: 6    # 整个会话累计最多反问 6 次

ingestion:
  # 支持格式（决策 #6，不做 HTML）
  allowed_extensions: [pdf, docx, pptx, md, txt]
  text_encodings: [utf-8, gbk, gb18030]
  max_file_size: 104857600               # 100 MB
  max_zip_size: 524288000                # 500 MB
  max_zip_total_size: 209715200          # 200 MB
  zip_max_workers: 4

  # PDF 文字层质量闸门（§E.8.1）—— 阈值照搬 RAGFlow / MinerU
  # ⚠️ 前四项是「页级/框级」，后两项是「整份文档级」，不能混用
  quality_gate:
    page_garbled_ratio: 0.3               # 页级乱码率 ≥30% → 该页走 OCR
    box_garbled_ratio: 0.5                # 框级乱码率 ≥50% → 该框走 OCR
    subset_font_ratio: 0.3                # 子集字体占比 ≥0.3
    subset_cjk_ratio: 0.05                # 且 CJK <0.05
    subset_ascii_punct_ratio: 0.4         # 且 ASCII 标点 >0.4
    min_chars_per_page: 50                # 整份级：平均每页有效字符 <50 判扫描件
    image_coverage_ratio: 0.8             # 整份级：图片覆盖率 ≥0.8 判扫描件

  # 竖排检测（§E.3.3）
  # ⚠️ 阈值必须写成 >= 0.5，不能写 > 0.5 —— 文档 06 恰好卡在 50%
  # ⚠️ 动作是「反转行序」恢复，不是丢弃；且必须在清洗之前
  vertical_text_single_char_ratio: 0.5

mineru:
  token_env: MINERU_TOKEN
  # 按页限定范围调用（§E.8.6）—— 不把整份 PDF 送出去
  timeout: 900

# 可观测性（§3.2.3.3）—— 运行指标那一块
observability:
  # 环境名（Langfuse 用来区分 development / production）
  environment: development
  # Langfuse 地址。⚠️ 必须显式配，SDK 缺省值是公有云（【方案 §10.2】）
  #    实际值走 security.yaml 的 langfuse_base_url → 环境变量
  langfuse_base_url: ""
  # 运行指标窗口（小时）。⚠️ 一律用「相对当前时间」，不要配绝对日期
  #    —— 实测传很久以前的绝对日期会被 API 拒（报错信息有误导性）
  metrics_window_hours: 24
  # 告警阈值（【方案 §8.3】方案 A：后端自算，不依赖 Langfuse Alerts API）
  # ⚠️ 阈值是初值，M5 用真实流量标定后才作数
  alert_thresholds:
    node_p95_ms: 10000        # 单节点 p95 超过 10 秒
    # ⚠️ 名字叫 5xx，实际拦的是 **`level=ERROR` 的观测占比**（Metrics API 没有
    #    HTTP 状态码维度，【方案 §8.3】）。键名继承自规则名 `RAGHttp5xxRate`，
    #    是前端契约的一部分 —— **别改键名**。
    http_5xx_rate: 0.05
  # 脱敏规则（【方案 §7.3】）——**必须配置化**，不写死在代码里：
  #   校园场景的标识符会变（学号位数、新增证件类型），
  #   写死意味着每次都要改代码 + 重新部署 + 重跑测试。
  # ⚠️ 正则一律用**双引号**写（与上面 rules.doc_number_pattern 同款）。
  #    YAML 单引号里反斜杠是字面量：写成 '\\d' 会变成「匹配一个反斜杠 + d」，
  #    规则静默失效、且测试之外看不出来 —— 已实测确认。
  #
  # ⚠️⚠️ **不许用 `\b`**（实测踩过，别再改回去）：
  #   Python `re` 对 str 默认 Unicode，而 `\w` **包含中文** ——
  #   所以「中文字 + 数字」之间根本没有 `\b`。写成 `\b\d{10}\b` 时，
  #   「我的学号是2023123456」整条规则**静默失效、学号原样外发**，
  #   而这恰恰是用户不带空格的日常写法（带空格的才命中，所以测试里看不出来）。
  #   规则：数字边界一律用 `(?<!\d)` / `(?!\d)`；邮箱字符类一律写显式 ASCII
  #   （`[\w.+-]` 同样含中文，会把「邮箱」一起吞进替换串）。
  #
  # ⚠️ 刻意**不**覆盖的三类（是取舍，不是漏配 —— 别顺手加正则）：
  #   · 姓名：正则做不到。中文姓名模式会命中海量正常正文，
  #     把可观测性本身毁掉（比漏掉一个字段的代价大得多）。
  #   · 非标准位数的学号：长度是**配置项**，由项目负责人按实际情况调。
  #     放宽成 \d{8,12} 会把年份、金额、计数一起吞掉。
  #   · 其它证件类型（护照 / 港澳台通行证 …）：新增就直接加一条 pattern。
  masking:
    enabled: true
    patterns:
      - name: student_id          # 学号：10 位纯数字（长度见上：配置项，不自动放宽）
        regex: "(?<!\\d)\\d{10}(?!\\d)"
      # 手机号：容忍常见分隔写法（13800138000 / 138-0013-8000 / 138 0013 8000）
      - name: phone
        regex: "(?<!\\d)1[3-9]\\d[\\s-]?\\d{4}[\\s-]?\\d{4}(?!\\d)"
      # 身份证：18 位 + 15 位遗留格式
      - name: id_card
        regex: "(?<!\\d)(?:\\d{17}[\\dXx]|\\d{15})(?!\\d)"
      # 邮箱：字符类写**显式 ASCII** —— `\w` 含中文，会把「邮箱」一起吞进替换串
      - name: email
        regex: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"

logging:
  level_env: LOG_LEVEL
  default_level: INFO
  # 控制台 handler 的最低级别：实际输出仍受 LOG_LEVEL/root 控制。
  # 设 DEBUG 表示「LOG_LEVEL=DEBUG 时控制台能看到子阶段与 DEBUG 详情」；
  # 设 INFO 会在 handler 层把 DEBUG 全部丢掉（即使 root 是 DEBUG）。
  console_level: DEBUG
  console_format: text          # text | json
  console_color: auto           # auto | always | never
  console_max_value_chars: 120
  # ⚠️ 仅用于本地调试：DEBUG 档会把 query / 改写 / rerank 片段写进控制台；
  #    INFO 档不会输出。生产环境请设 false，或不要开 DEBUG。
  trace_content: true
  trace_content_max_chars: 300
  dir: logs
  max_bytes: 10485760
  backup_count: 5
  # ⚠️ 脱敏是必须项：用户提问原文、检索片段、答案正文一律不进日志（§3.2.3.2）
  #    只记 query_len 与 query_hash
  redact_body: true
