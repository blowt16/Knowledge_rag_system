# Prometheus —— 存 spanmetrics 派生的运行指标，供 `stats/retrieval` 用 PromQL 查询（§3.2.3.3）
#
# ⚠️ 只拉 Collector 的 prometheus 导出口（8889），**不直接拉应用** ——
#    应用不暴露 /metrics，指标一律由 span 派生（§3.2.3.3 的数据流）。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
